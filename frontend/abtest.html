<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A/B Testing - PromptSpark</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="dash-nav">
    <span class="logo">⚡ PromptSpark</span>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="prompts.html">My Prompts</a>
      <a href="playground.html">Playground</a>
      <a href="abtest.html" class="active">A/B Test</a>
      <a href="analytics.html">Analytics</a>
      <button id="logoutBtn" class="btn-outline">Log Out</button>
    </div>
  </nav>

  <div class="dash-content">
    <h2>A/B Prompt Testing</h2>
    <p>Run two prompt variants against the same model and compare results side by side.</p>

    <div class="ab-grid">
      <div class="dash-card">
        <h4>Variant A</h4>
        <textarea id="variantA" rows="8" placeholder="Write variant A here..."></textarea>
        <div class="output-box" id="outputA" style="margin-top:12px;">Result will appear here.</div>
        <div class="usage-box" id="usageA"></div>
      </div>

      <div class="dash-card">
        <h4>Variant B</h4>
        <textarea id="variantB" rows="8" placeholder="Write variant B here..."></textarea>
        <div class="output-box" id="outputB" style="margin-top:12px;">Result will appear here.</div>
        <div class="usage-box" id="usageB"></div>
      </div>
    </div>

    <button id="runCompareBtn" class="btn-primary-gradient" style="width:auto; padding:12px 24px; margin-top:16px;">▶ Run Both Variants</button>
    <p id="compareStatus"></p>
  </div>

  <script src="js/abtest.js"></script>
  <script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
