<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - PromptSpark</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="dash-nav">
    <span class="logo">⚡ PromptSpark</span>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="prompts.html">My Prompts</a>
      <a href="playground.html">Playground</a>
      <a href="abtest.html">A/B Test</a>
      <a href="analytics.html" class="active">Analytics</a>
      <button id="logoutBtn" class="btn-outline">Log Out</button>
    </div>
  </nav>

  <div class="dash-content">
    <h2>Analytics & Cost Tracking</h2>

    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="statRuns">–</span>
        <span class="stat-label">Total AI Runs</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statTokens">–</span>
        <span class="stat-label">Total Tokens Used</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statCost">–</span>
        <span class="stat-label">Estimated Total Cost</span>
      </div>
    </div>

    <div class="charts-grid">
      <div class="dash-card">
        <h4>Cost — Last 14 Days</h4>
        <canvas id="costChart" height="200"></canvas>
      </div>
      <div class="dash-card">
        <h4>Tokens by Model</h4>
        <canvas id="modelChart" height="200"></canvas>
      </div>
    </div>
  </div>

  <script src="js/analytics.js"></script>
</body>
</html>
