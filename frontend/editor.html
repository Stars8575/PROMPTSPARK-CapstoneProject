<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Editor - PromptSpark</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="dash-nav">
    <span class="logo">⚡ PromptSpark</span>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="prompts.html">My Prompts</a>
      <a href="playground.html">Playground</a>
      <a href="abtest.html">A/B Test</a>
      <a href="analytics.html">Analytics</a>
      <button id="logoutBtn" class="btn-outline">Log Out</button>
    </div>
  </nav>

  <div class="dash-content">
    <div class="editor-grid">
      <div class="dash-card">
        <h3 id="editorTitle">New Prompt</h3>
        <form id="promptForm">
          <input type="hidden" id="promptId">
          <label>Title</label>
          <input type="text" id="title" placeholder="e.g. Product Description Generator" required>

          <label>Category</label>
          <select id="category">
            <option value="General">General</option>
            <option value="Marketing">Marketing</option>
            <option value="Coding">Coding</option>
            <option value="Writing">Writing</option>
            <option value="Support">Support</option>
          </select>

          <label>Prompt Content</label>
          <textarea id="content" rows="8" placeholder="Write your prompt here..." required></textarea>

          <div style="display:flex; gap:12px; margin-top:10px; flex-wrap:wrap;">
            <button type="submit" class="btn-primary-gradient" style="width:auto; padding:12px 24px;">Save Prompt</button>
            <button type="button" id="playgroundBtn" class="btn-outline" style="display:none;">▶ Test in Playground</button>
            <button type="button" id="deleteBtn" class="btn-outline" style="display:none;">Delete</button>
          </div>
        </form>
        <p id="message"></p>
      </div>

      <div class="dash-card" id="versionsCard" style="display:none;">
        <h3>Version History</h3>
        <div id="versionsList"></div>
      </div>
    </div>
  </div>

  <script src="js/editor.js"></script>
  <script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
