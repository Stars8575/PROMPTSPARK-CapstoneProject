<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Playground - PromptSpark</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="dash-nav">
    <span class="logo">⚡ PromptSpark</span>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="prompts.html">My Prompts</a>
      <a href="playground.html" class="active">Playground</a>
      <a href="abtest.html">A/B Test</a>
      <a href="analytics.html">Analytics</a>
      <button id="logoutBtn" class="btn-outline">Log Out</button>
    </div>
  </nav>

  <div class="dash-content">
    <div class="playground-grid">
      <div class="dash-card">
        <h3>AI Playground</h3>
        <label>Prompt</label>
        <textarea id="promptContent" rows="10" placeholder="Type or load a prompt to test..."></textarea>
        <button id="runBtn" class="btn-primary-gradient" style="margin-top:14px; width:auto; padding:12px 24px;">▶ Run with Groq</button>
        <p id="runStatus"></p>
      </div>

      <div class="dash-card">
        <h3>Output</h3>
        <div id="output" class="output-box">Run a prompt to see the AI response here.</div>
        <div id="usageBox" class="usage-box"></div>
      </div>
    </div>
  </div>

  <script src="js/playground.js"></script>
  <script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
