<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Prompts - PromptSpark</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="dash-nav">
    <span class="logo">⚡ PromptSpark</span>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="prompts.html" class="active">My Prompts</a>
      <a href="playground.html">Playground</a>
      <a href="abtest.html">A/B Test</a>
      <a href="analytics.html">Analytics</a>
      <button id="logoutBtn" class="btn-outline">Log Out</button>
    </div>
  </nav>

  <div class="dash-content">
    <div class="library-header">
      <h2>My Prompts</h2>
      <a href="editor.html" class="btn-primary-gradient" style="display:inline-block; width:auto; padding:12px 24px; text-decoration:none;">+ New Prompt</a>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Search prompts by title...">
      <select id="categoryFilter">
        <option value="All">All Categories</option>
        <option value="General">General</option>
        <option value="Marketing">Marketing</option>
        <option value="Coding">Coding</option>
        <option value="Writing">Writing</option>
        <option value="Support">Support</option>
      </select>
    </div>

    <div id="promptGrid" class="prompt-grid"></div>
    <p id="emptyMessage" style="display:none;">No prompts found. Create your first one!</p>
  </div>

  <script src="js/prompts.js"></script>
</body>
</html>
